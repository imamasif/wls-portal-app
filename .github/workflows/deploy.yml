name: Deploy WLS Portal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to CloudPanel / Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Client on GitHub Actions
        run: |
          cd client
          npm install
          npm run build

      - name: Deploy Server Code & Dependencies via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [Deploy] Starting deployment on production server..."
            cd /var/www/wls-portal

            echo "📥 [Deploy] Pulling latest changes from main..."
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            echo "📦 [Deploy] Installing server dependencies..."
            cd /var/www/wls-portal/server
            npm install --production=false

            echo "🔄 [Deploy] Restarting backend process with PM2..."
            pm2 restart wls-backend || pm2 start "npx tsx server.js" --name wls-backend
            pm2 save

            echo "🔍 [Deploy] Verifying PM2 status..."
            pm2 status wls-backend

      - name: Deploy Built Client Dist to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "client/dist"
          target: "/var/www/wls-portal/client"
          overwrite: true
          strip_components: 1

      - name: Deployment Success Notification
        run: |
          echo "✅ [Deploy] Successfully built on CI runner and deployed to https://wls-portal.iipc.ca!"
